spring.application.name=supportdesk
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supportdesk}
spring.datasource.username=${DB_USERNAME:supportdesk}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
